<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>DOOSAN Material</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#f3f6f9;color:#17202a;font-family:Arial,sans-serif}
header{background:#2f63ad;color:#fff;padding:28px 18px}
.wrap{max-width:1100px;margin:auto;padding:15px}
h1{margin:0 0 8px;font-size:28px}
.sub{font-size:16px;line-height:1.45}
.topbar{background:#fff;padding:12px 15px;border-radius:12px;box-shadow:0 1px 5px #0001;margin:15px auto;max-width:1100px}
.buttons{display:flex;gap:10px;flex-wrap:wrap;margin:0 0 8px}
button{font:inherit;border:1px solid #ccd5df;border-radius:10px;background:#fff;padding:12px 18px;cursor:pointer;color:#3280e8}
button.primary{background:#2f63ad;color:#fff;border-color:#2f63ad}
.status{font-size:14px;color:#555;padding:3px 0}
.search{background:#fff;border:1px solid #ccd5df;border-radius:12px;padding:14px 16px;width:100%;font-size:18px;margin-bottom:10px}
.filters{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:12px}
select{font:inherit;border:1px solid #ccd5df;border-radius:10px;background:#fff;padding:11px}
.stats{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin-bottom:12px}
.stat{background:#fff;padding:12px;border-radius:10px;text-align:center;box-shadow:0 1px 5px #0001}
.stat b{display:block;font-size:21px;color:#2f63ad}.stat span{font-size:12px;color:#667}
.card{background:#fff;padding:14px;border-radius:11px;margin-bottom:8px;border-left:5px solid #2f63ad;box-shadow:0 1px 5px #0001}
.row{display:flex;justify-content:space-between;gap:8px;align-items:center}
.code{font-weight:bold;word-break:break-all}.copy{padding:7px 9px;font-size:12px}
.meta{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.tag{background:#edf4fc;padding:5px 8px;border-radius:7px;font-size:12px}
.s1{background:#e7f7ec;color:#16743a}.s2{background:#fff1df;color:#a95c00}.none{background:#eee;color:#666}
.history{margin-top:9px;border-top:1px solid #eee;padding-top:8px;font-size:12px}
.history-item{padding:5px 0;border-bottom:1px dashed #ddd}
.empty{background:#fff;padding:35px;text-align:center;border-radius:10px;color:#667}
@media(max-width:700px){
 .filters{grid-template-columns:1fr 1fr}
 .stats{grid-template-columns:repeat(2,1fr)}
 h1{font-size:25px}
}
</style>
</head>
<body>

<div class="topbar">
  <div class="buttons">
    <button class="primary" onclick="window.location.reload()">🔄 Cập nhật dữ liệu</button>
    <button onclick="showDailyFiles()">📂 Danh sách file</button>
  </div>
  <div id="ghStatus" class="status">⏳ Đang tải dữ liệu...</div>
</div>

<header>
  <div class="wrap" style="padding:0">
    <h1>📦 DOOSAN Material</h1>
    <div class="sub">Dữ liệu lấy từ <b>DooSan Ô Môn 4 </b> </div>
  </div>
</header>

<div class="wrap">
  <input id="q" class="search" placeholder="🔎 Tìm P/L No., loại hàng, vị trí..." oninput="render()">

  <div class="filters">
    <select id="date" onchange="render()"><option value="">Ngày nhận</option></select>
    <select id="group" onchange="render()"><option value="">Loại hàng</option></select>
    <select id="category" onchange="render()"><option value="">P/L No.</option></select>
    <select id="loc" onchange="render()"><option value="">Vị trí</option></select>
  </div>

  <div class="stats">
    <div class="stat"><b id="total">0</b><span>Tổng kiện</span></div>
    <div class="stat"><b id="shown">0</b><span>Đang hiển thị</span></div>
    <div class="stat"><b id="groups">0</b><span>Nhóm</span></div>
    <div class="stat"><b id="cats">0</b><span>Danh mục</span></div>
    <div class="stat"><b id="locs">0</b><span>Vị trí</span></div>
  </div>

  <div id="list"></div>
</div>

<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<script>
const DATA_GITHUB_OWNER="quocdaicm";
const DATA_GITHUB_REPO="tra-cuu-kien-hang";
const DATA_GITHUB_BRANCH="main";
const DATA_GITHUB_FOLDER="du-lieu";

let dailyFiles=[];
let dailyData=[];
let data=[];
let moveHistory=[];

function norm(v){return String(v??"").trim();}

function formatDate(v){
  if(v instanceof Date && !isNaN(v))
    return String(v.getDate()).padStart(2,"0")+"/"+String(v.getMonth()+1).padStart(2,"0")+"/"+v.getFullYear();
  if(typeof v==="number"){
    const d=XLSX.SSF.parse_date_code(v);
    if(d)return String(d.d).padStart(2,"0")+"/"+String(d.m).padStart(2,"0")+"/"+d.y;
  }
  return norm(v);
}

function escapeHtml(s){
  return String(s).replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]));
}

function fileUrl(name){
  return "https://raw.githubusercontent.com/"+DATA_GITHUB_OWNER+"/"+DATA_GITHUB_REPO+"/"+DATA_GITHUB_BRANCH+"/"+DATA_GITHUB_FOLDER+"/"+encodeURIComponent(name);
}

async function listDailyExcelFiles(){
  const url=`https://api.github.com/repos/${DATA_GITHUB_OWNER}/${DATA_GITHUB_REPO}/contents/${DATA_GITHUB_FOLDER}?ref=${DATA_GITHUB_BRANCH}`;
  const r=await fetch(url,{cache:"no-store"});
  if(!r.ok)throw new Error("Không đọc được thư mục /du-lieu trên GitHub ("+r.status+").");
  const items=await r.json();
  return items
    .filter(x=>x.type==="file" && /\.(xlsx|xls)$/i.test(x.name))
    .sort((a,b)=>a.name.localeCompare(b.name,"en",{numeric:true}));
}

async function readExcelFile(item){
  const r=await fetch(fileUrl(item.name),{cache:"no-store"});
  if(!r.ok)throw new Error("Không tải được "+item.name);
  const buf=await r.arrayBuffer();
  const wb=XLSX.read(buf,{type:"array",cellDates:true});
  const ws=wb.Sheets[wb.SheetNames[0]];
  const rows=XLSX.utils.sheet_to_json(ws,{defval:""});
  const required=["Ngày","Mã kiện","Nhóm","Danh mục","Vị trí"];
  if(rows.length){
    const keys=Object.keys(rows[0]);
    const missing=required.filter(x=>!keys.includes(x));
    if(missing.length)throw new Error(item.name+" thiếu cột: "+missing.join(", "));
  }
  return rows.map(row=>({
    date:formatDate(row["Ngày"]),
    code:norm(row["Mã kiện"]),
    group:norm(row["Nhóm"]),
    category:norm(row["Danh mục"]),
    loc:norm(row["Vị trí"]),
    sourceFile:item.name
  })).filter(x=>x.code);
}

async function loadAllDailyExcel(){
  const status=document.getElementById("ghStatus");
  status.textContent="⏳ Đang đọc dữ liệu trong /du-lieu...";

  dailyFiles=await listDailyExcelFiles();
  if(!dailyFiles.length){
    dailyData=[];data=[];moveHistory=[];render();
    status.textContent="⚠️ Chưa có file Excel trong /du-lieu.";
    return;
  }

  const results=await Promise.all(dailyFiles.map(readExcelFile));
  dailyData=results.flat();

  // Sắp xếp theo ngày; nếu cùng ngày thì theo tên file.
  dailyData.sort((a,b)=>{
    const da=parseDate(a.date), db=parseDate(b.date);
    return (da-db) || a.sourceFile.localeCompare(b.sourceFile,"en",{numeric:true});
  });

  // Mỗi mã kiện lấy lần xuất hiện cuối cùng làm vị trí hiện tại.
  const map=new Map();
  const history=[];

  for(const item of dailyData){
    const old=map.get(item.code);
    if(old && norm(old.loc)!==norm(item.loc)){
      history.push({
        code:item.code,
        oldLoc:old.loc,
        newLoc:item.loc,
        time:item.date||item.sourceFile
      });
    }
    map.set(item.code,item);
  }

  data=[...map.values()].map(x=>({
    date:x.date,code:x.code,group:x.group,category:x.category,loc:x.loc
  }));

  moveHistory=history;
  render();

  status.textContent=`✅ Đã đọc ${dailyFiles.length} file Excel — ${dailyData.length} dòng — ${data.length} kiện hiện tại.`;
}

function parseDate(s){
  const m=String(s).match(/^(\d{1,2})[\/-](\d{1,2})[\/-](\d{4})$/);
  if(!m)return 0;
  return new Date(+m[3],+m[2]-1,+m[1]).getTime();
}

function unique(key){
  return [...new Set(data.map(x=>norm(x[key])).filter(Boolean))]
    .sort((a,b)=>a.localeCompare(b,"vi"));
}

function filterLabel(id){
  return ({
    date:"Ngày nhận",
    group:"Loại hàng",
    category:"P/L No.",
    loc:"Vị trí"
  })[id] || "Chọn";
}

function fillFilter(id,values){
  const el=document.getElementById(id);
  const old=el.value;
  el.innerHTML=`<option value="">${filterLabel(id)}</option>`+
    values.map(v=>`<option value="${escapeHtml(v)}">${escapeHtml(v)}</option>`).join("");
  if(values.includes(old))el.value=old;
}

function refreshFilters(){
  fillFilter("date",unique("date"));
  fillFilter("group",unique("group"));
  fillFilter("category",unique("category"));
  fillFilter("loc",unique("loc"));
}

function historyHtml(code){
  const h=moveHistory.filter(x=>x.code===code);
  if(!h.length)return "";
  return `<div class="history"><b>🕘 Lịch sử vị trí:</b>`+
    h.map(x=>`<div class="history-item">${escapeHtml(x.time)}: <b>${escapeHtml(x.oldLoc||"Chưa có")}</b> → <b>${escapeHtml(x.newLoc||"")}</b></div>`).join("")+
    `</div>`;
}

function render(){
  refreshFilters();
  const q=norm(document.getElementById("q").value).toLowerCase();
  const date=document.getElementById("date").value;
  const group=document.getElementById("group").value;
  const category=document.getElementById("category").value;
  const loc=document.getElementById("loc").value;

  const filtered=data.filter(x=>{
    const hay=[x.date,x.code,x.group,x.category,x.loc].join(" ").toLowerCase();
    return (!q||hay.includes(q)) &&
           (!date||x.date===date) &&
           (!group||x.group===group) &&
           (!category||x.category===category) &&
           (!loc||x.loc===loc);
  });

  document.getElementById("total").textContent=data.length;
  document.getElementById("shown").textContent=filtered.length;
  document.getElementById("groups").textContent=unique("group").length;
  document.getElementById("cats").textContent=unique("category").length;
  document.getElementById("locs").textContent=unique("loc").length;

  document.getElementById("list").innerHTML=filtered.length
    ? filtered.map((x,i)=>`
      <div class="card">
        <div class="row">
          <div class="code">${i+1}. ${escapeHtml(x.code)}</div>
          <button class="copy" onclick="copyCode('${escapeHtml(x.code)}')">📋 Copy</button>
        </div>
        <div class="meta">
          <span class="tag">📅 ${escapeHtml(x.date||"")}</span>
          <span class="tag">👥 ${escapeHtml(x.group||"")}</span>
          <span class="tag">📂 ${escapeHtml(x.category||"")}</span>
          <span class="tag ${x.loc==="S1"?"s1":x.loc==="S2"?"s2":"none"}">📍 ${escapeHtml(x.loc||"Chưa có vị trí")}</span>
        </div>
        ${historyHtml(x.code)}
      </div>`).join("")
    : '<div class="empty">Không tìm thấy kiện hàng.</div>';
}

function copyCode(code){
  navigator.clipboard?.writeText(code);
}

function reloadGitHubData(){
  loadAllDailyExcel().catch(err=>{
    console.error(err);
    document.getElementById("ghStatus").textContent="❌ "+err.message;
  });
}

function showDailyFiles(){
  if(!dailyFiles.length){
    alert("Chưa có file Excel trong /du-lieu.");
    return;
  }
  alert("Các file Excel đang có:\n\n"+dailyFiles.map(x=>"• "+x.name).join("\n"));
}

window.addEventListener("load",()=>loadAllDailyExcel().catch(err=>{
  document.getElementById("ghStatus").textContent="❌ "+err.message;
}));
</script>
</body>
</html>
