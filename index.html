/* ---------- LÀM ĐẸP CÁC NÚT GIỮ NGUYÊN GIAO DIỆN ---------- */
.topbar .buttons{
  gap:15px;
}
.topbar .buttons button{
  position:relative;
  overflow:hidden;
  border-radius:12px;
  transition:transform .2s ease,box-shadow .2s ease,filter .2s ease;
}
.topbar .buttons button::after{
  content:"";
  position:absolute;
  left:12%;
  right:12%;
  bottom:4px;
  height:2px;
  border-radius:99px;
  background:rgba(255,255,255,.55);
  opacity:0;
  transform:scaleX(.35);
  transition:.25s ease;
  pointer-events:none;
}
.topbar .buttons button:hover{
  transform:translateY(-2px);
  box-shadow:0 8px 18px rgba(17,105,143,.14);
  filter:brightness(1.02);
}
.topbar .buttons button:hover::after{
  opacity:1;
  transform:scaleX(1);
}
.topbar .buttons button:active{
  transform:translateY(0) scale(.98);
}
.topbar .buttons button.primary{
  box-shadow:0 8px 17px rgba(8,123,209,.20);
}
.topbar .buttons button.primary:hover{
  box-shadow:0 10px 22px rgba(8,123,209,.25);
}
@media(max-width:700px){
  .topbar .buttons{gap:6px}
  .topbar .buttons button:hover{transform:translateY(-1px)}
}

/* ---------- LÁ/CỎ CHUYỂN ĐỘNG QUANH VIỀN NÚT ---------- */
.topbar .buttons button{
  position:relative;
  isolation:isolate;
  overflow:visible;
}
.topbar .buttons button::before{
  content:"";
  position:absolute;
  inset:-5px;
  border:2px solid rgba(255,255,255,.95);
  border-radius:15px;
  pointer-events:none;
  z-index:-1;
  box-shadow:0 0 0 1px rgba(68,160,112,.08),0 4px 12px rgba(34,120,83,.08);
}
.topbar .buttons button::after{
  content:"🍃";
  position:absolute;
  left:4px;
  top:-8px;
  font-size:14px;
  line-height:1;
  filter:drop-shadow(0 2px 2px rgba(28,108,67,.18));
  animation:leafCrawl 5s linear infinite;
  pointer-events:none;
  z-index:3;
}
.topbar .buttons button:nth-child(2)::after{
  content:"🌿";
  animation-delay:-2.5s;
}
@keyframes leafCrawl{
  0%{left:3px;top:-8px;transform:rotate(-25deg) scale(.9)}
  25%{left:calc(100% - 12px);top:-8px;transform:rotate(25deg) scale(1)}
  50%{left:calc(100% - 12px);top:calc(100% - 5px);transform:rotate(115deg) scale(.9)}
  75%{left:3px;top:calc(100% - 5px);transform:rotate(195deg) scale(1)}
  100%{left:3px;top:-8px;transform:rotate(335deg) scale(.9)}
}
.topbar .buttons button:hover::before{
  box-shadow:0 0 0 1px rgba(46,184,137,.18),0 6px 18px rgba(34,120,83,.13);
}
@media(max-width:700px){
  .topbar .buttons button::after{font-size:11px;top:-7px}
  .topbar .buttons button::before{inset:-4px;border-radius:13px}
}

/* ---------- HIỆU ỨNG LÁ/CỎ CHO MỌI TƯƠNG TÁC ---------- */
.touch-leaf{
  position:fixed;
  z-index:9999;
  pointer-events:none;
  font-size:16px;
  line-height:1;
  animation:touchLeaf 900ms cubic-bezier(.2,.8,.2,1) forwards;
  filter:drop-shadow(0 2px 3px rgba(30,110,70,.22));
}
@keyframes touchLeaf{
  0%{opacity:0;transform:translate(-50%,-50%) scale(.35) rotate(-20deg)}
  18%{opacity:1;transform:translate(-50%,-50%) scale(1) rotate(5deg)}
  100%{opacity:0;transform:translate(calc(-50% + var(--dx)),calc(-50% + var(--dy))) scale(.65) rotate(var(--rot))}
}

/* Tối ưu hiệu ứng khi vuốt bằng tay trên điện thoại */
.touch-leaf{
  will-change:transform,opacity;
  user-select:none;
  -webkit-user-select:none;
}

<body>
<div class="topbar">

<div class="wrap">

      <div class="filter-box"><label><span class="filter-icon tag">🏷️</span> Mô tả hàng hóa</label><select id="group" onchange="currentPage=1;render()"><option value="">Mô tả hàng hóa</option></select></div>
      <div class="filter-box"><label><span class="filter-icon file">📄</span> P/L No.</label><select id="category" onchange="currentPage=1;render()"><option value="">Chọn P/L No.</option></select></div>

<div id="fileModal" class="file-modal" onclick="if(event.target===this)closeFileModal()">

  </div>

<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<script>
const DATA_GITHUB_OWNER="quocdaicm";
const DATA_GITHUB_REPO="tra-cuu-kien-hang";
const DATA_GITHUB_BRANCH="main";
const DATA_GITHUB_FOLDER="du-lieu";

let dailyFiles=[];
let dailyData=[];
let data=[];
let moveHistory=[];

function norm(v){return String(v??"").trim();}

// Xử lý ngày Excel tuyệt đối theo lịch, không dùng Date/getDate() để tránh lệch múi giờ.
function formatDate(v){
  if(v instanceof Date && !isNaN(v)){
    // Chỉ dùng thành phần UTC của Date do SheetJS tạo từ serial Excel.
    return String(v.getUTCDate()).padStart(2,"0")+"/"+String(v.getUTCMonth()+1).padStart(2,"0")+"/"+v.getUTCFullYear();
  }
  if(typeof v==="number"){
    const d=XLSX.SSF.parse_date_code(v);
    if(d){
      return String(d.d).padStart(2,"0")+"/"+String(d.m).padStart(2,"0")+"/"+d.y;
    }
  }
  const s=norm(v);
  // Chuẩn hóa các chuỗi ngày phổ biến nhưng không parse qua new Date().
  const m=s.match(/^(\d{4})[\/-](\d{1,2})[\/-](\d{1,2})$/);
  if(m) return String(+m[3]).padStart(2,"0")+"/"+String(+m[2]).padStart(2,"0")+"/"+m[1];
  const dmy=s.match(/^(\d{1,2})[\/-](\d{1,2})[\/-](\d{4})$/);
  if(dmy) return String(+dmy[1]).padStart(2,"0")+"/"+String(+dmy[2]).padStart(2,"0")+"/"+dmy[3];
  return s;
}

function escapeHtml(s){
  return String(s).replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]));
}

function fileUrl(name){
  return "https://raw.githubusercontent.com/"+DATA_GITHUB_OWNER+"/"+DATA_GITHUB_REPO+"/"+DATA_GITHUB_BRANCH+"/"+DATA_GITHUB_FOLDER+"/"+encodeURIComponent(name);
}

async function listDailyExcelFiles(){
  const url=`https://api.github.com/repos/${DATA_GITHUB_OWNER}/${DATA_GITHUB_REPO}/contents/${DATA_GITHUB_FOLDER}?ref=${DATA_GITHUB_BRANCH}`;
  const r=await fetch(url,{cache:"no-store"});
  if(!r.ok)throw new Error("Không đọc được thư mục /du-lieu trên GitHub ("+r.status+").");
  const items=await r.json();
  return items
    .filter(x=>x.type==="file" && /\.(xlsx|xls)$/i.test(x.name))
    .sort((a,b)=>fileDateKey(b.name)-fileDateKey(a.name) || b.name.localeCompare(a.name,"en",{numeric:true}));
}

async function readExcelFile(item){
  const r=await fetch(fileUrl(item.name),{cache:"no-store"});
  if(!r.ok)throw new Error("Không tải được "+item.name);
  const buf=await r.arrayBuffer();
  const wb=XLSX.read(buf,{type:"array",cellDates:false,cellNF:true});
  const ws=wb.Sheets[wb.SheetNames[0]];
  const rows=XLSX.utils.sheet_to_json(ws,{defval:""});

  if(!rows.length)return [];

  const keys=Object.keys(rows[0]);
  const findKey=(aliases)=>{
    const normalized=new Map(keys.map(k=>[norm(k).toLowerCase(),k]));
    for(const a of aliases){
      const k=normalized.get(norm(a).toLowerCase());
      if(k)return k;
    }
    return null;
  };

  const dateKey=findKey(["Ngày","Date"]);
  const codeKey=findKey(["Package No.","Mã kiện","Package No","Mã kiện hàng"]);
  const groupKey=findKey(["Mô tả hàng hóa","Nhóm","Loại hàng","Description"]);
  const categoryKey=findKey(["P/L No.","PL No.","P/L","PL"]);
  const locKey=findKey(["Vị trí","Location","Loc"]);

  const missing=[];
  if(!dateKey)missing.push("Ngày");
  if(!codeKey)missing.push("Package No. / Mã kiện");
  if(!groupKey)missing.push("Mô tả hàng hóa / Nhóm");
  if(!categoryKey)missing.push("P/L No.");
  if(!locKey)missing.push("Vị trí");
  if(missing.length)throw new Error(item.name+" thiếu cột: "+missing.join(", "));

  return rows.map(row=>({
    date:formatDate(row[dateKey]),
    code:norm(row[codeKey]),
    group:norm(row[groupKey]),
    category:norm(row[categoryKey]),
    loc:norm(row[locKey]),
    sourceFile:item.name
  })).filter(x=>x.code);
}

async function loadAllDailyExcel(){
  const status=document.getElementById("ghStatus");
  status.textContent="⏳ Đang đọc dữ liệu trong /du-lieu...";

  dailyFiles=await listDailyExcelFiles();
  if(!dailyFiles.length){
    dailyData=[];data=[];moveHistory=[];render();
    status.textContent="⚠️ Chưa có file Excel trong /du-lieu.";
    return;
  }

  const results=await Promise.all(dailyFiles.map(readExcelFile));
  dailyData=results.flat();

  // Sắp xếp theo ngày; nếu cùng ngày thì theo tên file.
  dailyData.sort((a,b)=>{
    const da=parseDate(a.date), db=parseDate(b.date);
    return (da-db) || a.sourceFile.localeCompare(b.sourceFile,"en",{numeric:true});
  });

  // Gộp tất cả mã kiện. Dòng mới nhất được ưu tiên, nhưng ô Vị trí trống
  // KHÔNG xóa vị trí đã có. Nhờ vậy file 50 kiện, chỉ 20 kiện có vị trí
  // vẫn hiển thị đủ 50 kiện và giữ nguyên vị trí của các kiện đã được nhập.
  const map=new Map();
  const history=[];

  for(const item of dailyData){
    const old=map.get(item.code);
    if(!old){
      map.set(item.code,{...item});
      continue;
    }

    const oldLoc=norm(old.loc);
    const newLoc=norm(item.loc);

    if(newLoc && oldLoc!==newLoc){
      history.push({
        code:item.code,
        oldLoc:oldLoc,
        newLoc:newLoc,
        time:item.date||item.sourceFile
      });
    }

    map.set(item.code,{
      ...old,
      ...item,
      date:item.date||old.date,
      code:item.code,
      group:item.group||old.group,
      category:item.category||old.category,
      // Blank location in a newer file means "not entered yet", not "delete old location".
      loc:newLoc||oldLoc
    });
  }

  data=[...map.values()].map(x=>({
    date:x.date,code:x.code,group:x.group,category:x.category,loc:x.loc
  }));

  moveHistory=history;
  render();

  status.textContent=`✅ Đã đọc ${dailyFiles.length} file Excel — ${dailyData.length} dòng — ${data.length} kiện (kể cả kiện chưa có vị trí).`;
}

function parseDate(s){
  const m=String(s).match(/^(\d{1,2})[\/-](\d{1,2})[\/-](\d{4})$/);
  if(!m)return 0;
  // So sánh YYYYMMDD như số, không tạo JavaScript Date để tránh timezone.
  return (+m[3])*10000+(+m[2])*100+(+m[1]);
}

function unique(key){
  const values=[...new Set(data.map(x=>norm(x[key])).filter(Boolean))];
  return key==="date" ? values.sort((a,b)=>parseDate(b)-parseDate(a)) : values.sort((a,b)=>a.localeCompare(b,"vi"));
}
function fileDateKey(name){
  const s=String(name||"");
  let m=s.match(/(?:^|[^0-9])(\d{1,2})[._-](\d{1,2})[._-](\d{4})(?:[^0-9]|$)/);
  if(m)return (+m[3])*10000+(+m[2])*100+(+m[1]);
  m=s.match(/(?:^|[^0-9])(\d{4})[._-](\d{1,2})[._-](\d{1,2})(?:[^0-9]|$)/);
  if(m)return (+m[1])*10000+(+m[2])*100+(+m[3]);
  return 0;
}
function fileDateText(name){
  const k=fileDateKey(name); if(!k)return "Chưa nhận diện ngày";
  return String(k%100).padStart(2,"0")+"/"+String(Math.floor((k%10000)/100)).padStart(2,"0")+"/"+Math.floor(k/10000);
}

function filterLabel(id){
  return ({
    date:"Ngày nhận",
    group:"Mô tả hàng hóa",
    category:"P/L No.",
    loc:"Vị trí"
  })[id] || "Chọn";
}

function fillFilter(id,values){
  const el=document.getElementById(id);
  const old=el.value;
  el.innerHTML=`<option value="">${filterLabel(id)}</option>`+
    values.map(v=>`<option value="${escapeHtml(v)}">${escapeHtml(v)}</option>`).join("");
  if(values.includes(old))el.value=old;
}

function refreshFilters(){
  fillFilter("date",unique("date"));
  fillFilter("group",unique("group"));
  fillFilter("category",unique("category"));
  fillFilter("loc",unique("loc"));
}

function historyHtml(code){
  const h=moveHistory.filter(x=>x.code===code);
  if(!h.length)return "";
  return `<div class="history"><div class="history-title"><span class="history-icon">◷</span> Lịch sử di chuyển</div>`+
    h.map(x=>`<div class="history-item">${escapeHtml(x.time)}: <b>${escapeHtml(x.oldLoc||"Chưa có")}</b> → <b>${escapeHtml(x.newLoc||"")}</b></div>`).join("")+
    `</div>`;
}


let currentFiltered=[];
let currentPage=1;
const pageSize=5;

function render(){
  refreshFilters();
  const q=norm(document.getElementById("q").value).toLowerCase();
  const date=document.getElementById("date").value;
  const group=document.getElementById("group").value;
  const category=document.getElementById("category").value;
  const loc=document.getElementById("loc").value;

  const filtered=data.filter(x=>{
    const hay=[x.date,x.code,x.group,x.category,x.loc].join(" ").toLowerCase();
    return (!q||hay.includes(q)) && (!date||x.date===date) && (!group||x.group===group) && (!category||x.category===category) && (!loc||x.loc===loc);
  });

  currentFiltered=filtered;
  const totalPages=Math.max(1,Math.ceil(filtered.length/pageSize));
  if(currentPage>totalPages) currentPage=totalPages;
  const start=(currentPage-1)*pageSize;
  const pageItems=filtered.slice(start,start+pageSize);

  document.getElementById("total").textContent=data.length.toLocaleString("vi-VN");
  document.getElementById("shown").textContent=filtered.length.toLocaleString("vi-VN");
  document.getElementById("cats").textContent=unique("category").length;
  document.getElementById("locs").textContent=unique("loc").length;

  document.getElementById("list").innerHTML=pageItems.length
    ? pageItems.map((x,i)=>`
      <div class="card">
        <div class="card-main">
          <div class="package-icon"><span>📦</span></div>
          <div>
            <div class="code">${start+i+1}. ${escapeHtml(x.code)}</div>
            <button class="copy" onclick="copyCode('${escapeHtml(x.code)}')"><span>📋</span> Copy mã</button>
          </div>
          <div class="field"><span class="field-label"><span class="mini-icon">🏷️</span> Mô tả hàng hóa</span><span class="field-value">${escapeHtml(x.group||"—")}</span></div>
          <div class="field"><span class="field-label"><span class="mini-icon">📄</span> P/L No.</span><span class="field-value">${escapeHtml(x.category||"—")}</span></div>
          <div class="field field-location"><span class="field-label"><span class="mini-icon">📍</span> Vị trí</span><span class="field-value">${x.loc ? `<span class="location-badge">${escapeHtml(x.loc)}</span>` : `<span class="location-empty">Chưa có</span>`}</span></div>
          <div class="field"><span class="field-label"><span class="mini-icon">📅</span> Ngày nhận</span><span class="field-value">${escapeHtml(x.date||"—")}</span></div>
          <div class="share-wrap"><button class="share" onclick="shareItem(${start+i})"><span>🔗</span> Chia sẻ</button></div>
        </div>
        ${historyHtml(x.code)}
      </div>`).join("")
    : '<div class="empty">Không tìm thấy kiện hàng.</div>';

  const p=document.getElementById("pagination");
  p.innerHTML=totalPages>1 ? `<button onclick="goPage(${currentPage-1})" ${currentPage===1?'disabled':''}>‹</button>`+Array.from({length:Math.min(totalPages,5)},(_,i)=>{let n=i+1;return `<button class="${n===currentPage?'active':''}" onclick="goPage(${n})">${n}</button>`}).join("")+`<button onclick="goPage(${currentPage+1})" ${currentPage===totalPages?'disabled':''}>›</button>` : '';
}
function goPage(n){currentPage=Math.max(1,Math.min(n,Math.ceil(currentFiltered.length/pageSize)||1));render();window.scrollTo({top:document.getElementById("list").offsetTop-10,behavior:"smooth"});}

function shareItem(index){
  const x=currentFiltered[index];
  if(!x)return;

  const title=`📦 Kiện hàng ${x.code}`;
  const details=[
    `Mã kiện: ${x.code||"—"}`,
    `Mô tả hàng hóa: ${x.group||"—"}`,
    `P/L No.: ${x.category||"—"}`,
    `Vị trí: ${x.loc||"Chưa có vị trí"}`,
    `Ngày nhận: ${x.date||"—"}`
  ].join("\n");
  const shareText=`${title}\n${details}`;

  if(navigator.share){
    navigator.share({
      title:title,
      text:shareText,
      url:location.href
    }).catch(()=>{});
  }else{
    navigator.clipboard?.writeText(shareText).then(()=>{
      showShareNotice("✅ Đã sao chép kết quả để bạn gửi/chia sẻ.");
    }).catch(()=>{
      showShareNotice(shareText);
    });
  }
}

function showShareNotice(message){
  const old=document.querySelector(".share-result");
  if(old)old.remove();
  const el=document.createElement("div");
  el.className="share-result";
  el.textContent=message;
  document.body.appendChild(el);
  setTimeout(()=>el.remove(),2600);
}

function copyCode(code){
  navigator.clipboard?.writeText(code);
}

function reloadGitHubData(){
  loadAllDailyExcel().catch(err=>{
    console.error(err);
    document.getElementById("ghStatus").textContent="❌ "+err.message;
  });
}

let fileCurrentPage=1;
const filePageSize=7;
function showDailyFiles(){
  const modal=document.getElementById("fileModal");
  if(!dailyFiles.length){document.getElementById("fileList").innerHTML='<div class="file-empty">📂 Chưa có file Excel trong /du-lieu.</div>';modal.classList.add("show");document.body.style.overflow="hidden";return;}
  const dates=[...new Set(dailyFiles.map(x=>fileDateKey(x.name)).filter(Boolean))].sort((a,b)=>b-a);
  document.getElementById("fileDateFilter").innerHTML='<option value="">📅 Tất cả ngày</option>'+dates.map(k=>'<option value="'+k+'">📅 '+String(k%100).padStart(2,"0")+'/'+String(Math.floor((k%10000)/100)).padStart(2,"0")+'/'+Math.floor(k/10000)+'</option>').join("");
  document.getElementById("fileSearch").value=""; document.getElementById("fileDateFilter").value=""; fileCurrentPage=1; renderFileList();
  modal.classList.add("show"); document.body.style.overflow="hidden";
}
function renderFileList(){
  const q=norm(document.getElementById("fileSearch")?.value).toLowerCase(), dk=Number(document.getElementById("fileDateFilter")?.value||0);
  const filtered=dailyFiles.filter(x=>(!q||x.name.toLowerCase().includes(q))&&(!dk||fileDateKey(x.name)===dk));
  const pages=Math.max(1,Math.ceil(filtered.length/filePageSize)); if(fileCurrentPage>pages)fileCurrentPage=pages;
  const items=filtered.slice((fileCurrentPage-1)*filePageSize,fileCurrentPage*filePageSize);
  document.getElementById("fileSortNote").textContent=filtered.length+" file • Mới nhất trước";
  document.getElementById("fileList").innerHTML=items.length?items.map(x=>`<div class="file-item"><div class="file-icon">📊</div><div class="file-info"><div class="file-name">${escapeHtml(x.name)}</div><div class="file-meta">📅 ${fileDateText(x.name)} • ${x.size?formatFileSize(x.size):"Excel"}</div></div><a class="file-download" href="${fileUrl(x.name)}" download="${escapeHtml(x.name)}">⬇ Tải file</a></div>`).join(""):'<div class="file-empty">🔎 Không tìm thấy file phù hợp.</div>';
  const p=document.getElementById("filePagination"); p.innerHTML=pages>1?`<button onclick="goFilePage(${fileCurrentPage-1})" ${fileCurrentPage===1?'disabled':''}>‹</button>`+Array.from({length:Math.min(pages,5)},(_,i)=>{let n=i+1;if(pages>5&&fileCurrentPage>3)n=Math.min(pages-4+i,pages);return `<button class="${n===fileCurrentPage?'active':''}" onclick="goFilePage(${n})">${n}</button>`}).join("")+`<button onclick="goFilePage(${fileCurrentPage+1})" ${fileCurrentPage===pages?'disabled':''}>›</button>`:"";
}
function goFilePage(n){fileCurrentPage=Math.max(1,n);renderFileList();document.getElementById("fileList").scrollTop=0;}
function closeFileModal(){document.getElementById("fileModal").classList.remove("show");document.body.style.overflow="";}
function formatFileSize(bytes){if(!bytes)return "";if(bytes<1024)return bytes+" B";if(bytes<1024*1024)return (bytes/1024).toFixed(1)+" KB";return (bytes/1024/1024).toFixed(1)+" MB";}
document.addEventListener("keydown",e=>{if(e.key==="Escape")closeFileModal()});

window.addEventListener("load",()=>loadAllDailyExcel().catch(err=>{
  document.getElementById("ghStatus").textContent="❌ "+err.message;
}));
</script>

<script>
/* Hiệu ứng lá/cỏ toàn trang: chạm, kéo và vuốt trên mobile */
(function(){
  const leaves=["🍃","🌿","☘️"];
  let lastX=0,lastY=0,lastTime=0;
  let active=false;
  let lastEmit=0;

  function leaf(x,y,dx,dy){
    const el=document.createElement("span");
    el.className="touch-leaf";
    el.textContent=leaves[(Math.random()*leaves.length)|0];
    el.style.left=x+"px";
    el.style.top=y+"px";
    el.style.setProperty("--dx",(dx+(Math.random()*32-16))+"px");
    el.style.setProperty("--dy",(dy+(Math.random()*32-16))+"px");
    el.style.setProperty("--rot",((Math.random()*120)-60)+"deg");
    document.body.appendChild(el);
    setTimeout(()=>el.remove(),1050);
  }

  function emit(x,y){
    const now=performance.now();
    if(now-lastEmit<55)return;
    lastEmit=now;
    const dx=(x-lastX)*.55;
    const dy=(y-lastY)*.55;
    leaf(x,y,dx,dy);
    if(Math.random()>.45) leaf(x+(Math.random()*10-5),y+(Math.random()*10-5),-dx, -dy);
    lastX=x;lastY=y;lastTime=now;
  }

  document.addEventListener("pointerdown",e=>{
    active=true;
    lastX=e.clientX;lastY=e.clientY;lastTime=performance.now();
    emit(e.clientX,e.clientY);
  },{passive:true});

  document.addEventListener("pointermove",e=>{
    if(!active)return;
    emit(e.clientX,e.clientY);
  },{passive:true});

  document.addEventListener("pointerup",()=>{active=false},{passive:true});
  document.addEventListener("pointercancel",()=>{active=false},{passive:true});
  document.addEventListener("pointerleave",()=>{active=false},{passive:true});

  /* Thiết bị cũ không hỗ trợ Pointer Events */
  document.addEventListener("touchmove",e=>{
    const t=e.touches[0];
    if(t)emit(t.clientX,t.clientY);
  },{passive:true});
})();
</script>
