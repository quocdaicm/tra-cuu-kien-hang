<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>DOOSAN Material</title>
<style>
*{box-sizing:border-box}
:root{
  --blue:#087bd1;--blue2:#36b8ef;--cyan:#28c2d5;--green:#35bf91;
  --ink:#142d4a;--muted:#68798e;--line:#e3edf4;--paper:#fff;
}
html{scroll-behavior:smooth}
body{
  margin:0;color:var(--ink);font-family:Inter,ui-sans-serif,Arial,sans-serif;
  min-height:100vh;background:
  radial-gradient(circle at 12% 9%,rgba(100,211,250,.24),transparent 23%),
  radial-gradient(circle at 88% 35%,rgba(79,204,163,.16),transparent 22%),
  linear-gradient(145deg,#eef9ff 0%,#f8fbfd 52%,#effaf6 100%);
}
body:before{
  content:"";position:fixed;inset:0;z-index:-1;pointer-events:none;opacity:.25;
  background-image:radial-gradient(#8bcfe8 .8px,transparent .8px);background-size:25px 25px;
}

/* ---------- HERO / BANNER ---------- */
header{
  position:relative;overflow:hidden;padding:30px 18px 74px;color:var(--ink);
  background:
    radial-gradient(ellipse at 50% 10%,rgba(255,255,255,.98) 0 25%,rgba(232,248,255,.74) 54%,rgba(204,239,249,.35) 100%),
    linear-gradient(180deg,#e9f8ff,#f7fcff 68%,#eef9f5);
  border-bottom:0;
  box-shadow:0 8px 30px rgba(24,118,161,.12);
}
header:after{
  content:"";position:absolute;left:-5%;right:-5%;bottom:-46px;height:96px;
  background:linear-gradient(110deg,#087bd1 0%,#2eade9 42%,#31bf92 100%);
  border-radius:50% 50% 0 0/70% 70% 0 0;
  transform:rotate(-1deg);
}
header:before{
  content:"";position:absolute;left:-25px;top:14px;width:190px;height:120px;
  background:
    radial-gradient(ellipse at 20% 50%,#4cae6f 0 12%,transparent 13%),
    radial-gradient(ellipse at 40% 20%,#6fcf83 0 12%,transparent 13%),
    radial-gradient(ellipse at 65% 60%,#2f9b69 0 13%,transparent 14%),
    radial-gradient(ellipse at 88% 18%,#8bdc8b 0 11%,transparent 12%);
  opacity:.38;transform:rotate(-16deg);
}
.wrap{max-width:1100px;margin:auto;padding:15px;position:relative;z-index:2}
.hero{text-align:center}
.logo-wrap{display:flex;justify-content:center;align-items:center;margin:0 0 8px}
.logo{
  width:255px;height:auto;display:block;
  filter:drop-shadow(0 6px 12px rgba(0,92,150,.12))
}
h1{margin:3px 0 6px;font-size:30px;letter-spacing:.2px;color:#172e4a}
.sub{font-size:15px;line-height:1.55;color:#546d82}
.sub b{color:#087bd1}

/* ---------- ACTION BAR ---------- */

.topbar-inner{
  display:flex;align-items:center;justify-content:space-between;gap:18px;
  min-height:58px
}
.status-box{
  display:flex;align-items:center;gap:9px;min-width:220px;justify-content:flex-end
}
.status-dot{
  width:24px;height:24px;border-radius:50%;display:flex;align-items:center;
  justify-content:center;background:#20b77b;color:#fff;font-size:14px;font-weight:800;
  box-shadow:0 3px 9px rgba(32,183,123,.24)
}
.status-title{font-size:13px;font-weight:800;color:#18324a;line-height:1.2}
.topbar{
  max-width:1100px;margin:-30px auto 22px;padding:14px 18px;
  background:rgba(255,255,255,.96);border:1px solid #e4eef4;border-radius:22px;
  box-shadow:0 12px 35px rgba(28,102,138,.14);position:relative;z-index:5;
  backdrop-filter:blur(14px)
}
.buttons{display:flex;gap:12px;flex-wrap:nowrap;align-items:center;margin:0;flex:0 0 auto}
.buttons button{white-space:nowrap}
button{
  font:inherit;border:1px solid #cddfe9;border-radius:13px;background:#fff;
  padding:11px 18px;cursor:pointer;color:#17506f;transition:.2s
}
button:hover{transform:translateY(-2px);box-shadow:0 7px 18px rgba(17,105,143,.12)}
button.primary{
  background:linear-gradient(135deg,#087bd1,#258fe3);color:#fff;border-color:#087bd1;
  box-shadow:0 7px 18px rgba(8,123,209,.22)
}
.status{
  margin:2px 0 0;text-align:left;font-size:11px;color:#718293;
  white-space:nowrap
}

/* ---------- SEARCH / FILTERS ---------- */
.search-panel{
  background:rgba(255,255,255,.76);border:1px solid rgba(255,255,255,.95);
  border-radius:22px;padding:16px;box-shadow:0 10px 30px rgba(37,112,143,.08);
  backdrop-filter:blur(8px);margin-bottom:16px
}
.search{
  background:#fff;border:1px solid #e0eaf1;border-radius:18px;padding:15px 18px;
  width:100%;font-size:18px;margin-bottom:12px;outline:none;
  box-shadow:0 5px 16px rgba(35,111,144,.07)
}
.search:focus{border-color:#45b9eb;box-shadow:0 0 0 4px rgba(69,185,235,.13)}
.filters{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin:0}
.filter-box{
  background:rgba(255,255,255,.96);padding:10px 12px;border:1px solid #e4edf3;
  border-radius:15px;box-shadow:0 4px 13px rgba(33,107,138,.05)
}
.filter-box label{display:block;font-size:12px;font-weight:700;color:#1b3650;margin:0 0 6px}
select{
  width:100%;font:inherit;border:1px solid #d5e3eb;border-radius:11px;
  background:#fff;padding:10px;color:#4a6275;outline:none
}

/* ---------- METRICS ---------- */
.stats{display:grid;grid-template-columns:repeat(5,1fr);gap:10px;margin:0 0 17px}
.stat{
  min-height:94px;background:rgba(255,255,255,.96);padding:12px 13px;border-radius:16px;
  box-shadow:0 7px 20px rgba(29,112,137,.09);border:1px solid #e3edf3;
  display:flex;align-items:center;gap:11px;text-align:left
}
.stat:before{
  width:46px;height:46px;border-radius:50%;display:flex;align-items:center;
  justify-content:center;font-size:21px;flex:0 0 46px
}
.stat:nth-child(1){border-top:3px solid #298de0}.stat:nth-child(1):before{content:"📦";background:#e7f3ff}
.stat:nth-child(2){border-top:3px solid #38bf8e}.stat:nth-child(2):before{content:"👁";background:#e7faf2}
.stat:nth-child(3){border-top:3px solid #f3b552}.stat:nth-child(3):before{content:"◈";background:#fff5e3}
.stat:nth-child(4){border-top:3px solid #8e7bf0}.stat:nth-child(4):before{content:"📁";background:#f1efff}
.stat:nth-child(5){border-top:3px solid #38b9bd}.stat:nth-child(5):before{content:"📍";background:#e9fbfa}
.stat b{display:block;font-size:22px;color:#173a60;line-height:1.1}
.stat span{font-size:12px;color:#68798e;display:block;margin-top:4px}

/* ---------- SHIPMENT CARDS ---------- */
.card{
  background:rgba(255,255,255,.98);padding:16px 18px;border-radius:18px;margin-bottom:12px;
  border:1px solid #e2edf3;border-left:5px solid #269ee2;
  box-shadow:0 8px 24px rgba(30,112,136,.09);position:relative;overflow:hidden
}
.card:after{
  content:"";position:absolute;right:-25px;top:-30px;width:110px;height:150px;
  background:radial-gradient(ellipse,#6fcfa055 0 17%,transparent 18%);
  transform:rotate(35deg);opacity:.45;pointer-events:none
}
.card-main{display:grid;grid-template-columns:76px minmax(180px,1.2fr) repeat(4,minmax(90px,1fr)) auto;gap:14px;align-items:center}
.package-icon{
  width:68px;height:68px;border-radius:13px;display:flex;align-items:center;
  justify-content:center;font-size:30px;color:#fff;background:linear-gradient(145deg,#168de0,#0875c4);
  box-shadow:0 7px 17px rgba(17,120,197,.20)
}
.card:nth-child(3n) .package-icon{background:linear-gradient(145deg,#2ec294,#18a477)}
.card:nth-child(4n) .package-icon{background:linear-gradient(145deg,#ffab25,#f48600)}
.code{font-weight:800;word-break:break-all;color:#162f4c;font-size:17px}
.copy{padding:7px 10px;font-size:12px;margin-top:8px}
.share{padding:10px 14px;background:linear-gradient(135deg,#12b7c2,#1aa9bc);color:#fff;border-color:#12b7c2;white-space:nowrap}
.field{min-width:0}
.field-label{display:block;font-size:11px;color:#66798a;margin-bottom:6px}
.field-value{font-size:13px;color:#1a304b;font-weight:600;word-break:break-word}
.meta{display:flex;flex-wrap:wrap;gap:7px;margin-top:12px}
.tag{background:#eff8fd;padding:6px 9px;border-radius:9px;font-size:12px;color:#356176;border:1px solid #dceef4}
.tag:nth-child(2){background:#effaf6;border-color:#d5eee4;color:#28765c}
.tag:nth-child(3){background:#fff8e9;border-color:#f5e4bd;color:#9a6a18}
.s1{background:#e7f8f1;color:#177553}.s2{background:#fff0df;color:#a95c00}.none{background:#f0f3f5;color:#667}
.history{margin-top:13px;border-top:1px solid #e7eff4;padding-top:9px;font-size:12px}
.history-title{font-weight:700;color:#456476;margin-bottom:4px}
.history-item{padding:5px 0;border-bottom:1px dashed #dce8ee}
.empty{background:#fff;padding:35px;text-align:center;border-radius:15px;color:#667;box-shadow:0 7px 20px rgba(27,112,156,.08)}
.share-result{
  position:fixed;left:50%;bottom:22px;transform:translateX(-50%);
  background:linear-gradient(135deg,#1178a6,#27a98a);color:#fff;padding:11px 17px;
  border-radius:13px;box-shadow:0 10px 28px #1178a644;z-index:10;font-size:14px
}

/* ---------- FOOTER WAVE ---------- */
.site-footer{position:relative;margin-top:55px;min-height:120px;overflow:hidden;color:#fff;text-align:center;padding:62px 20px 25px}
.site-footer:before,.site-footer:after{
  content:"";position:absolute;left:-5%;right:-5%;z-index:-1
}
.site-footer:before{
  bottom:-55px;height:115px;background:linear-gradient(110deg,#087bd1,#209ee3 48%,#35bf8f);
  border-radius:55% 55% 0 0/55% 55% 0 0;transform:rotate(-2deg)
}
.site-footer:after{
  bottom:-75px;height:100px;background:rgba(255,255,255,.24);
  border-radius:55% 55% 0 0/55% 55% 0 0;transform:rotate(2deg)
}
.site-footer small{position:relative;font-size:12px;text-shadow:0 1px 4px rgba(0,50,90,.28)}

@media(max-width:900px){
 .card-main{grid-template-columns:64px 1fr 1fr 1fr;gap:12px}
 .card-main .field:nth-of-type(3),.card-main .field:nth-of-type(4){display:none}
 .card-main .share-wrap{grid-column:4;grid-row:1}
}
@media(max-width:700px){
 header{padding:25px 14px 62px}
 .logo{width:195px}.topbar{margin:-25px 10px 16px;padding:10px}
 .topbar-inner{gap:7px}
 .buttons{gap:6px;flex:1;min-width:0}
 .buttons button{flex:1;min-width:0;padding:10px 5px;font-size:12px}
 .status-box{min-width:0;gap:5px}
 .status-dot{width:21px;height:21px;font-size:12px;flex:0 0 21px}
 .status-title{font-size:10px;white-space:nowrap}
 .status{font-size:9px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:95px}
 .wrap{padding:10px}.filters{grid-template-columns:1fr 1fr}
 .stats{grid-template-columns:1fr 1fr}.stat{min-height:78px}
 .card{padding:13px}.card-main{grid-template-columns:58px 1fr auto;gap:10px}
 .package-icon{width:56px;height:56px;font-size:25px}
 .card-main .field{grid-column:2/4}.card-main .field:nth-of-type(n+2){display:block}
 .card-main .share-wrap{grid-column:3;grid-row:1}
 .share{padding:8px 10px;font-size:12px}
 .field-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}
}
</style>
</head>

<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<script>
const DATA_GITHUB_OWNER="quocdaicm";
const DATA_GITHUB_REPO="tra-cuu-kien-hang";
const DATA_GITHUB_BRANCH="main";
const DATA_GITHUB_FOLDER="du-lieu";

let dailyFiles=[];
let dailyData=[];
let data=[];
let moveHistory=[];

function norm(v){return String(v??"").trim();}

function formatDate(v){
  if(v instanceof Date && !isNaN(v))
    return String(v.getDate()).padStart(2,"0")+"/"+String(v.getMonth()+1).padStart(2,"0")+"/"+v.getFullYear();
  if(typeof v==="number"){
    const d=XLSX.SSF.parse_date_code(v);
    if(d)return String(d.d).padStart(2,"0")+"/"+String(d.m).padStart(2,"0")+"/"+d.y;
  }
  return norm(v);
}

function escapeHtml(s){
  return String(s).replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]));
}

function fileUrl(name){
  return "https://raw.githubusercontent.com/"+DATA_GITHUB_OWNER+"/"+DATA_GITHUB_REPO+"/"+DATA_GITHUB_BRANCH+"/"+DATA_GITHUB_FOLDER+"/"+encodeURIComponent(name);
}

async function listDailyExcelFiles(){
  const url=`https://api.github.com/repos/${DATA_GITHUB_OWNER}/${DATA_GITHUB_REPO}/contents/${DATA_GITHUB_FOLDER}?ref=${DATA_GITHUB_BRANCH}`;
  const r=await fetch(url,{cache:"no-store"});
  if(!r.ok)throw new Error("Không đọc được thư mục /du-lieu trên GitHub ("+r.status+").");
  const items=await r.json();
  return items
    .filter(x=>x.type==="file" && /\.(xlsx|xls)$/i.test(x.name))
    .sort((a,b)=>a.name.localeCompare(b.name,"en",{numeric:true}));
}

async function readExcelFile(item){
  const r=await fetch(fileUrl(item.name),{cache:"no-store"});
  if(!r.ok)throw new Error("Không tải được "+item.name);
  const buf=await r.arrayBuffer();
  const wb=XLSX.read(buf,{type:"array",cellDates:true});
  const ws=wb.Sheets[wb.SheetNames[0]];
  const rows=XLSX.utils.sheet_to_json(ws,{defval:""});
  const required=["Ngày","Mã kiện","Nhóm","Danh mục","Vị trí"];
  if(rows.length){
    const keys=Object.keys(rows[0]);
    const missing=required.filter(x=>!keys.includes(x));
    if(missing.length)throw new Error(item.name+" thiếu cột: "+missing.join(", "));
  }
  return rows.map(row=>({
    date:formatDate(row["Ngày"]),
    code:norm(row["Mã kiện"]),
    group:norm(row["Nhóm"]),
    category:norm(row["Danh mục"]),
    loc:norm(row["Vị trí"]),
    sourceFile:item.name
  })).filter(x=>x.code);
}

async function loadAllDailyExcel(){
  const status=document.getElementById("ghStatus");
  status.textContent="⏳ Đang đọc dữ liệu trong /du-lieu...";

  dailyFiles=await listDailyExcelFiles();
  if(!dailyFiles.length){
    dailyData=[];data=[];moveHistory=[];render();
    status.textContent="⚠️ Chưa có file Excel trong /du-lieu.";
    return;
  }

  const results=await Promise.all(dailyFiles.map(readExcelFile));
  dailyData=results.flat();

  // Sắp xếp theo ngày; nếu cùng ngày thì theo tên file.
  dailyData.sort((a,b)=>{
    const da=parseDate(a.date), db=parseDate(b.date);
    return (da-db) || a.sourceFile.localeCompare(b.sourceFile,"en",{numeric:true});
  });

  // Mỗi mã kiện lấy lần xuất hiện cuối cùng làm vị trí hiện tại.
  const map=new Map();
  const history=[];

  for(const item of dailyData){
    const old=map.get(item.code);
    if(old && norm(old.loc)!==norm(item.loc)){
      history.push({
        code:item.code,
        oldLoc:old.loc,
        newLoc:item.loc,
        time:item.date||item.sourceFile
      });
    }
    map.set(item.code,item);
  }

  data=[...map.values()].map(x=>({
    date:x.date,code:x.code,group:x.group,category:x.category,loc:x.loc
  }));

  moveHistory=history;
  render();

  status.textContent=`✅ Đã đọc ${dailyFiles.length} file Excel — ${dailyData.length} dòng — ${data.length} kiện hiện tại.`;
}

function parseDate(s){
  const m=String(s).match(/^(\d{1,2})[\/-](\d{1,2})[\/-](\d{4})$/);
  if(!m)return 0;
  return new Date(+m[3],+m[2]-1,+m[1]).getTime();
}

function unique(key){
  return [...new Set(data.map(x=>norm(x[key])).filter(Boolean))]
    .sort((a,b)=>a.localeCompare(b,"vi"));
}

function filterLabel(id){
  return ({
    date:"Ngày nhận",
    group:"Loại hàng",
    category:"P/L No.",
    loc:"Vị trí"
  })[id] || "Chọn";
}

function fillFilter(id,values){
  const el=document.getElementById(id);
  const old=el.value;
  el.innerHTML=`<option value="">${filterLabel(id)}</option>`+
    values.map(v=>`<option value="${escapeHtml(v)}">${escapeHtml(v)}</option>`).join("");
  if(values.includes(old))el.value=old;
}

function refreshFilters(){
  fillFilter("date",unique("date"));
  fillFilter("group",unique("group"));
  fillFilter("category",unique("category"));
  fillFilter("loc",unique("loc"));
}

function historyHtml(code){
  const h=moveHistory.filter(x=>x.code===code);
  if(!h.length)return "";
  return `<div class="history"><div class="history-title">🕘 Lịch sử vị trí</div>`+
    h.map(x=>`<div class="history-item">${escapeHtml(x.time)}: <b>${escapeHtml(x.oldLoc||"Chưa có")}</b> → <b>${escapeHtml(x.newLoc||"")}</b></div>`).join("")+
    `</div>`;
}

let currentFiltered=[];

function render(){
  refreshFilters();
  const q=norm(document.getElementById("q").value).toLowerCase();
  const date=document.getElementById("date").value;
  const group=document.getElementById("group").value;
  const category=document.getElementById("category").value;
  const loc=document.getElementById("loc").value;

  const filtered=data.filter(x=>{
    const hay=[x.date,x.code,x.group,x.category,x.loc].join(" ").toLowerCase();
    return (!q||hay.includes(q)) &&
           (!date||x.date===date) &&
           (!group||x.group===group) &&
           (!category||x.category===category) &&
           (!loc||x.loc===loc);
  });

  currentFiltered=filtered;

  document.getElementById("total").textContent=data.length;
  document.getElementById("shown").textContent=filtered.length;
  document.getElementById("groups").textContent=unique("group").length;
  document.getElementById("cats").textContent=unique("category").length;
  document.getElementById("locs").textContent=unique("loc").length;

  document.getElementById("list").innerHTML=filtered.length
    ? filtered.map((x,i)=>`
      <div class="card">
        <div class="card-main">
          <div class="package-icon">📦</div>
          <div>
            <div class="code">${i+1}. ${escapeHtml(x.code)}</div>
            <button class="copy" onclick="copyCode('${escapeHtml(x.code)}')">📋 Copy mã</button>
          </div>
          <div class="field"><span class="field-label">Loại hàng</span><span class="field-value">${escapeHtml(x.group||"—")}</span></div>
          <div class="field"><span class="field-label">P/L No.</span><span class="field-value">${escapeHtml(x.category||"—")}</span></div>
          <div class="field"><span class="field-label">Vị trí</span><span class="field-value">${escapeHtml(x.loc||"Chưa có")}</span></div>
          <div class="field"><span class="field-label">Ngày nhận</span><span class="field-value">📅 ${escapeHtml(x.date||"—")}</span></div>
          <div class="share-wrap"><button class="share" onclick="shareItem(${i})">🔗 Chia sẻ</button></div>
        </div>
        ${historyHtml(x.code)}
      </div>`).join("")
    : '<div class="empty">Không tìm thấy kiện hàng.</div>';
}

function shareItem(index){
  const x=currentFiltered[index];
  if(!x)return;

  const title=`📦 Kiện hàng ${x.code}`;
  const details=[
    `Mã kiện: ${x.code||"—"}`,
    `Loại hàng: ${x.group||"—"}`,
    `P/L No.: ${x.category||"—"}`,
    `Vị trí: ${x.loc||"Chưa có vị trí"}`,
    `Ngày nhận: ${x.date||"—"}`
  ].join("\n");
  const shareText=`${title}\n${details}`;

  if(navigator.share){
    navigator.share({
      title:title,
      text:shareText,
      url:location.href
    }).catch(()=>{});
  }else{
    navigator.clipboard?.writeText(shareText).then(()=>{
      showShareNotice("✅ Đã sao chép kết quả để bạn gửi/chia sẻ.");
    }).catch(()=>{
      showShareNotice(shareText);
    });
  }
}

function showShareNotice(message){
  const old=document.querySelector(".share-result");
  if(old)old.remove();
  const el=document.createElement("div");
  el.className="share-result";
  el.textContent=message;
  document.body.appendChild(el);
  setTimeout(()=>el.remove(),2600);
}

function copyCode(code){
  navigator.clipboard?.writeText(code);
}

function reloadGitHubData(){
  loadAllDailyExcel().catch(err=>{
    console.error(err);
    document.getElementById("ghStatus").textContent="❌ "+err.message;
  });
}

function showDailyFiles(){
  if(!dailyFiles.length){
    alert("Chưa có file Excel trong /du-lieu.");
    return;
  }
  alert("Các file Excel đang có:\n\n"+dailyFiles.map(x=>"• "+x.name).join("\n"));
}

window.addEventListener("load",()=>loadAllDailyExcel().catch(err=>{
  document.getElementById("ghStatus").textContent="❌ "+err.message;
}));
</script>
