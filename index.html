<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>DOOSAN Material</title>
<style>
*{box-sizing:border-box}
:root{--blue:#087bd1;--blue2:#2aa8e8;--cyan:#18b8c7;--green:#2eb889;--ink:#172b49;--muted:#6b7890;--line:#dce7ef;--paper:#fff}
html{scroll-behavior:smooth}
body{margin:0;color:var(--ink);font-family:Inter,ui-sans-serif,Arial,sans-serif;min-height:100vh;background:linear-gradient(180deg,#eaf6fc 0,#f4f9fc 42%,#e8f0f3 100%);overflow-x:hidden}
body:before{content:"";position:fixed;inset:0;z-index:-3;background:radial-gradient(circle at 12% 18%,rgba(24,168,226,.18),transparent 23%),radial-gradient(circle at 88% 34%,rgba(54,184,137,.12),transparent 20%),linear-gradient(180deg,rgba(255,255,255,.3),rgba(208,222,229,.15))}
.gas-plant-bg{position:fixed;inset:0;z-index:-2;pointer-events:none;overflow:hidden;opacity:.30;mix-blend-mode:multiply}
.gas-plant-bg svg{position:absolute;left:50%;bottom:-2px;width:1500px;min-width:115%;height:520px;transform:translateX(-50%);filter:drop-shadow(0 16px 24px rgba(24,65,82,.18)) saturate(1.15) contrast(1.05)}
.gas-plant-glow{position:absolute;width:230px;height:230px;right:6%;bottom:170px;border-radius:50%;background:radial-gradient(circle,rgba(255,179,55,.26),rgba(255,179,55,.08) 35%,transparent 70%);animation:gasGlow 3s ease-in-out infinite}
@keyframes gasGlow{0%,100%{transform:scale(.92);opacity:.55}50%{transform:scale(1.08);opacity:1}}
.wrap{max-width:1040px;margin:auto;padding:12px 20px;position:relative;z-index:2}
header{position:relative;overflow:hidden;text-align:center;padding:26px 18px 82px;background:linear-gradient(180deg,rgba(245,251,253,.98),rgba(222,240,247,.94));box-shadow:0 8px 30px rgba(30,120,165,.10)}
header:before{content:"";position:absolute;inset:0;opacity:.55;background:radial-gradient(ellipse at 8% 8%,transparent 0 5%,rgba(66,159,115,.18) 5.5% 6%,transparent 6.5%),radial-gradient(ellipse at 92% 12%,rgba(67,181,131,.22) 0 4%,transparent 4.5%),radial-gradient(ellipse at 14% 75%,rgba(50,164,111,.18) 0 3%,transparent 3.5%);pointer-events:none}
header:after{content:"";position:absolute;left:-8%;right:-8%;bottom:-53px;height:112px;background:linear-gradient(110deg,#0a7bc4,#2c9fd2 45%,#2d8f92);border-radius:52% 52% 0 0/62% 62% 0 0;transform:rotate(-1.5deg)}
.hero{padding:0!important}.logo-wrap{display:flex;justify-content:center;align-items:center;margin:0 auto 4px}.logo{width:510px;max-width:82vw;height:auto;display:block;filter:drop-shadow(0 7px 13px rgba(0,92,150,.12))}
h1{margin:3px 0 4px;font-size:28px;letter-spacing:.2px}.sub{font-size:15px;line-height:1.5;color:#536b83}.sub b{color:#087bd1}
.topbar{max-width:1000px;margin:-34px auto 22px;padding:18px 22px;background:rgba(255,255,255,.98);border:1px solid #e3edf3;border-radius:21px;box-shadow:0 12px 32px rgba(30,105,139,.13);position:relative;z-index:5}
.topbar-inner{display:flex;align-items:center;justify-content:space-between;gap:20px;min-height:62px}.buttons{display:flex;gap:15px;align-items:center}.buttons button{white-space:nowrap}
button{font:inherit;border:1px solid #d0dee8;border-radius:12px;background:#fff;padding:11px 18px;cursor:pointer;color:#173450;transition:.2s;box-shadow:0 3px 8px rgba(32,91,119,.06)}button:hover{transform:translateY(-1px);box-shadow:0 7px 18px rgba(17,105,143,.12)}button.primary{background:linear-gradient(135deg,#087bd1,#268fe0);color:#fff;border-color:#087bd1;box-shadow:0 8px 17px rgba(8,123,209,.20)}
.status-box{display:flex;align-items:center;gap:9px;min-width:220px;justify-content:flex-end}.status-dot{width:20px;height:20px;border-radius:50%;display:flex;align-items:center;justify-content:center;background:#20b77b;color:#fff;font-size:12px;font-weight:800}.status-title{font-size:13px;font-weight:800;line-height:1.2}.status{margin:3px 0 0;text-align:left;font-size:11px;color:#718293;white-space:nowrap}
.search-panel{background:rgba(255,255,255,.93);border:1px solid #e5eef4;border-radius:21px;padding:14px;box-shadow:0 8px 25px rgba(37,112,143,.08);margin-bottom:16px}.search-row{display:flex;gap:10px;align-items:center}.search{background:#fff;border:1px solid #dfe8ef;border-radius:18px;padding:15px 18px;width:100%;font-size:18px;outline:none;box-shadow:0 4px 13px rgba(35,111,144,.06)}.search:focus{border-color:#45b9eb;box-shadow:0 0 0 4px rgba(69,185,235,.13)}.filter-toggle{width:52px;height:52px;padding:0;border-radius:50%;font-size:23px;flex:0 0 52px}.filters{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-top:13px}.filter-box{background:#fff;padding:10px 12px;border:1px solid #e1eaf0;border-radius:13px;box-shadow:0 3px 10px rgba(33,107,138,.04)}.filter-box label{display:block;font-size:12px;font-weight:800;color:#1b3650;margin:0 0 7px}select{width:100%;font:inherit;border:1px solid #d5e3eb;border-radius:11px;background:#fff;padding:10px 12px;color:#4a6275;outline:none}
.stats{display:grid;grid-template-columns:repeat(5,1fr);gap:10px;margin:0 0 18px}.stat{min-height:92px;background:rgba(255,255,255,.97);padding:12px 13px;border-radius:15px;box-shadow:0 6px 18px rgba(29,112,137,.08);border:1px solid #e1ebf1;display:flex;align-items:center;gap:10px}.stat b{display:block;font-size:22px;color:#173a60;line-height:1.1}.stat span{font-size:12px;color:#68798e;display:block;margin-top:4px}
.card{background:rgba(255,255,255,.98);padding:15px 18px 11px;border-radius:16px;margin-bottom:12px;border:1px solid #e0e9ef;border-left:4px solid #269ee2;box-shadow:0 7px 20px rgba(30,112,136,.08);position:relative;overflow:hidden}.card:after{content:"";position:absolute;right:-20px;top:-25px;width:90px;height:135px;background:radial-gradient(ellipse,#6fcfa055 0 17%,transparent 18%);transform:rotate(35deg);opacity:.45;pointer-events:none}.card:nth-child(2){border-left-color:#35b991}.card:nth-child(3){border-left-color:#f4ad35}
.card-main{display:grid;grid-template-columns:70px minmax(180px,1.45fr) repeat(4,minmax(90px,1fr)) auto;gap:13px;align-items:center;position:relative;z-index:1}.package-icon{width:68px;height:68px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:28px;color:#fff;background:linear-gradient(145deg,#168de0,#0875c4);box-shadow:0 6px 14px rgba(17,120,197,.18)}.card:nth-child(2) .package-icon{background:linear-gradient(145deg,#2ec294,#18a477)}.card:nth-child(3) .package-icon{background:linear-gradient(145deg,#ffab25,#f48600)}
.code{font-weight:800;word-break:normal;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:#162f4c;font-size:16px;line-height:1.2;min-width:0}.copy{padding:6px 9px;font-size:11px;margin-top:7px;border-radius:8px}.share{padding:9px 14px;background:linear-gradient(135deg,#12b7c2,#1aa9bc);color:#fff;border-color:#12b7c2;white-space:nowrap;border-radius:9px}.field{min-width:0}.field-label{display:block;font-size:11px;color:#536277;margin-bottom:7px}.field-value{font-size:13px;color:#1a304b;font-weight:600;word-break:break-word}.history{margin-top:10px;border-top:1px solid #e7eff4;padding:8px 0 0 82px;font-size:11px;position:relative;z-index:1}.history-title{font-weight:700;color:#456476;margin-bottom:4px}.history-item{padding:4px 0;border-bottom:1px dashed #dce8ee}.empty{background:#fff;padding:35px;text-align:center;border-radius:15px;color:#667;box-shadow:0 7px 20px rgba(27,112,156,.08)}
.pagination{display:flex;justify-content:center;align-items:center;gap:8px;margin:22px 0 4px}.pagination button{width:38px;height:38px;padding:0;border-radius:8px}.pagination button.active{background:#087bd1;color:#fff;border-color:#087bd1}.share-result{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);background:linear-gradient(135deg,#1178a6,#27a98a);color:#fff;padding:11px 17px;border-radius:13px;box-shadow:0 10px 28px #1178a644;z-index:10;font-size:14px}
.site-footer{position:relative;margin-top:48px;min-height:145px;overflow:hidden;color:#fff;text-align:center;padding:72px 20px 25px}.site-footer:before{content:"";position:absolute;left:-7%;right:-7%;bottom:-58px;height:130px;background:linear-gradient(105deg,#0a6599,#1687b7 46%,#2d8f92);border-radius:55% 55% 0 0/60% 60% 0 0;transform:rotate(-1.5deg);z-index:-1}.site-footer:after{content:"";position:absolute;left:-8%;right:-8%;bottom:-78px;height:95px;background:rgba(255,255,255,.18);border-radius:55% 55% 0 0/60% 60% 0 0;transform:rotate(2deg);z-index:-1}.site-footer small{font-size:12px;text-shadow:0 1px 4px rgba(0,50,90,.28)}

/* ---------- ICONS + MOTION ---------- */
.search-wrap{position:relative;flex:1;min-width:0}.search-wrap .search{padding-left:50px}.search-icon{position:absolute;left:18px;top:50%;transform:translateY(-50%);font-size:24px;z-index:2;filter:drop-shadow(0 2px 2px rgba(30,70,100,.12));pointer-events:none}.filter-toggle{background:linear-gradient(145deg,#fff,#f4fbff);border:1px solid #dbe8f0;box-shadow:0 7px 18px rgba(42,116,148,.12);position:relative;overflow:hidden}.filter-toggle span{display:block;transition:transform .3s ease}.filter-toggle:hover span{transform:rotate(90deg) scale(1.08)}
.filter-box{position:relative;overflow:hidden;transition:transform .25s ease,box-shadow .25s ease,border-color .25s ease}.filter-box:before{content:"";position:absolute;inset:0;background:linear-gradient(120deg,rgba(8,123,209,.08),transparent 45%,rgba(46,184,137,.06));opacity:0;transition:opacity .25s ease;pointer-events:none}.filter-box:hover{transform:translateY(-3px);border-color:#c8e3f0;box-shadow:0 9px 20px rgba(38,125,158,.11)}.filter-box:hover:before{opacity:1}.filter-icon,.mini-icon{display:inline-flex;align-items:center;justify-content:center;vertical-align:middle;line-height:1}.filter-icon{font-size:15px;margin-right:4px}.filter-icon.pin{font-size:16px}.filter-box label{position:relative;z-index:1}
select{transition:border-color .2s ease,box-shadow .2s ease,transform .2s ease}select:focus{border-color:#55b8e5;box-shadow:0 0 0 4px rgba(85,184,229,.12);transform:translateY(-1px)}
.stat{position:relative;overflow:hidden;transition:transform .28s cubic-bezier(.2,.8,.2,1),box-shadow .28s ease}.stat:after{content:"";position:absolute;width:85px;height:85px;border-radius:50%;right:-35px;top:-35px;background:rgba(255,255,255,.45);transition:transform .35s ease}.stat:hover{transform:translateY(-5px);box-shadow:0 13px 28px rgba(29,112,137,.14)}.stat:hover:after{transform:scale(1.35)}.stat-icon{width:50px;height:50px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:23px;flex:0 0 50px;box-shadow:inset 0 0 0 1px rgba(255,255,255,.65);transition:transform .35s ease}.stat:hover .stat-icon{transform:rotate(-6deg) scale(1.08)}.stat-blue{border-top:3px solid #269ee2}.stat-green{border-top:3px solid #35b991}.stat-orange{border-top:3px solid #f4ad35}.stat-purple{border-top:3px solid #8c6ce8}.stat-cyan{border-top:3px solid #35b9ba}.stat-blue .stat-icon{background:#e8f3ff}.stat-green .stat-icon{background:#e7faf3}.stat-orange .stat-icon{background:#fff3df}.stat-purple .stat-icon{background:#f0edff}.stat-cyan .stat-icon{background:#e7fbfa}.stat div{position:relative;z-index:1}.stat b{font-variant-numeric:tabular-nums}
.package-icon{position:relative;overflow:hidden;transition:transform .3s ease,box-shadow .3s ease}.package-icon:after{content:"";position:absolute;inset:-60%;background:linear-gradient(120deg,transparent 42%,rgba(255,255,255,.28) 50%,transparent 58%);transform:translateX(-35%) rotate(10deg);transition:transform .55s ease}.card:hover .package-icon{transform:translateY(-2px) rotate(-2deg);box-shadow:0 10px 20px rgba(17,120,197,.22)}.card:hover .package-icon:after{transform:translateX(35%) rotate(10deg)}.code{transition:color .2s ease}.card:hover .code{color:#087bd1}.mini-icon{font-size:12px;margin-right:3px}.copy,.share{transition:transform .2s ease,box-shadow .2s ease,filter .2s ease}.copy:hover,.share:hover{transform:translateY(-2px);filter:brightness(1.03);box-shadow:0 7px 15px rgba(15,112,145,.15)}.share span{display:inline-block;transition:transform .25s ease}.share:hover span{transform:rotate(15deg) scale(1.12)}.history-title{display:flex;align-items:center;gap:5px}.history-icon{font-size:15px;color:#087bd1;display:inline-block;animation:pulseClock 2s ease-in-out infinite}@keyframes pulseClock{0%,100%{transform:scale(1);opacity:.75}50%{transform:scale(1.12);opacity:1}}

@media(max-width:900px){.card-main{grid-template-columns:62px 1.4fr 1fr 1fr auto;gap:10px}.card-main .field:nth-of-type(3),.card-main .field:nth-of-type(4){display:none}}
@media(max-width:700px){header{padding:20px 12px 64px}.logo{width:270px;max-width:88vw}h1{font-size:23px}.sub{font-size:13px}.wrap{padding:9px 10px}.topbar{margin:-28px 10px 16px;padding:10px 11px}.topbar-inner{gap:8px}.buttons{gap:6px;flex:1;min-width:0}.buttons button{flex:1;min-width:0;padding:9px 5px;font-size:11px}.status-box{min-width:0;gap:5px}.status-dot{width:19px;height:19px;flex:0 0 19px}.status-title{font-size:9px}.status{font-size:8px;max-width:85px;overflow:hidden;text-overflow:ellipsis}.search-panel{padding:10px;border-radius:17px}.search-row{gap:7px}.search{font-size:15px;padding:13px 14px}.filter-toggle{width:46px;height:46px;flex-basis:46px;font-size:20px}.filters{grid-template-columns:1fr 1fr;gap:7px;margin-top:9px}.filter-box{padding:8px}.filter-box label{font-size:10px}.filter-box select{font-size:12px;padding:8px}.stats{grid-template-columns:1fr 1fr;gap:7px}.stat{min-height:72px;padding:9px}.stat b{font-size:18px}.stat span{font-size:10px}.card{padding:10px 10px 9px;margin-bottom:9px}.card-main{grid-template-columns:48px minmax(0,1fr) auto;gap:8px}.package-icon{width:46px;height:46px;font-size:20px;border-radius:9px}.card-main .field{grid-column:2/4}.card-main .field:nth-of-type(2){display:block}.card-main .field:nth-of-type(n+3){display:block}.card-main .share-wrap{grid-column:3;grid-row:1}.code{font-size:14px;white-space:nowrap}.copy{padding:5px 8px;font-size:10px;margin-top:5px}.share{padding:7px 9px;font-size:11px}.field-label{font-size:9px;margin-bottom:3px}.field-value{font-size:12px}.history{padding-left:56px;font-size:10px}.pagination{gap:5px}.pagination button{width:34px;height:34px}.site-footer{margin-top:35px;min-height:110px;padding-top:58px}}

@media(max-width:700px){.gas-plant-bg{opacity:.19}.gas-plant-bg svg{width:1100px;height:390px;bottom:0}.gas-plant-glow{width:120px;height:120px;right:3%;bottom:140px}.search-wrap .search{padding-left:43px}.search-icon{left:14px;font-size:21px}.filter-toggle{width:46px;height:46px;flex-basis:46px}.filter-icon{font-size:13px}.stat{gap:9px}.stat-icon{width:42px;height:42px;flex-basis:42px;font-size:19px}.stat b{font-size:20px}.stat span{font-size:11px}.filter-box:hover,.stat:hover{transform:none}.package-icon{transform:none}.card:hover .package-icon{transform:none}.mini-icon{font-size:10px}}
</style>
</head>
<body>
<div class="gas-plant-bg" aria-hidden="true">
  <div class="gas-plant-glow"></div>
  <svg viewBox="0 0 1600 620" xmlns="http://www.w3.org/2000/svg" preserveAspectRatio="xMidYMax slice">
    <defs>
      <linearGradient id="plantSky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#b9dff0"/><stop offset=".58" stop-color="#e7f0f2"/><stop offset="1" stop-color="#aabcc3"/></linearGradient>
      <linearGradient id="metalDark" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#273f4a"/><stop offset=".45" stop-color="#526d78"/><stop offset="1" stop-color="#1d343e"/></linearGradient>
      <linearGradient id="metalLight" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#d5e0e3"/><stop offset=".45" stop-color="#8199a1"/><stop offset="1" stop-color="#4b636c"/></linearGradient>
      <linearGradient id="glass" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#c8eef8" stop-opacity=".95"/><stop offset=".45" stop-color="#6b9eae" stop-opacity=".75"/><stop offset="1" stop-color="#203f4c" stop-opacity=".9"/></linearGradient>
      <linearGradient id="fire" x1="0" y1="1" x2="0" y2="0"><stop stop-color="#ff7a00"/><stop offset=".45" stop-color="#ffb21e"/><stop offset=".78" stop-color="#ffe98a"/><stop offset="1" stop-color="#fff"/></linearGradient>
      <linearGradient id="road" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#344e57"/><stop offset=".5" stop-color="#5d7278"/><stop offset="1" stop-color="#2a444d"/></linearGradient>
      <filter id="softShadow"><feGaussianBlur stdDeviation="7"/></filter>
      <filter id="smoke"><feGaussianBlur stdDeviation="10"/></filter>
    </defs>
    <rect width="1600" height="620" fill="url(#plantSky)"/>
    <ellipse cx="800" cy="548" rx="760" ry="70" fill="#263f47" opacity=".22" filter="url(#softShadow)"/>
    <!-- distant industrial skyline -->
    <g opacity=".55" fill="#6b858e">
      <rect x="35" y="360" width="220" height="100"/><rect x="255" y="330" width="120" height="130"/><rect x="1220" y="330" width="250" height="130"/><rect x="1470" y="350" width="95" height="110"/>
      <path d="M45 360l80-62 80 62zM1240 330l85-70 85 70z"/>
    </g>
    <!-- cooling tower -->
    <path d="M112 480 C125 405 136 330 178 300 C220 270 270 270 312 300 C354 330 366 405 378 480Z" fill="url(#metalLight)" stroke="#49636c" stroke-width="4"/>
    <ellipse cx="245" cy="300" rx="67" ry="15" fill="#dce8ea" stroke="#637b82" stroke-width="4"/>
    <path d="M145 350 C205 330 285 330 345 350M132 390 C205 370 300 370 358 390" fill="none" stroke="#9fb1b6" stroke-width="5" opacity=".75"/>
    <!-- main turbine hall -->
    <g stroke="#314d58" stroke-width="4">
      <rect x="410" y="330" width="670" height="150" rx="5" fill="url(#metalLight)"/>
      <path d="M390 330 L450 285 L1050 285 L1100 330Z" fill="#496671"/>
      <path d="M430 340h630M430 385h630M430 430h630" stroke="#d2dee1" opacity=".45"/>
      <rect x="470" y="350" width="110" height="90" fill="url(#glass)"/>
      <rect x="620" y="350" width="110" height="90" fill="url(#glass)"/>
      <rect x="770" y="350" width="110" height="90" fill="url(#glass)"/>
      <rect x="920" y="350" width="110" height="90" fill="url(#glass)"/>
    </g>
    <!-- HRSG / heat recovery units -->
    <g stroke="#324f59" stroke-width="4">
      <rect x="520" y="185" width="190" height="145" fill="url(#metalDark)"/>
      <rect x="760" y="170" width="190" height="160" fill="url(#metalDark)"/>
      <g stroke="#a8bec5" stroke-width="5" opacity=".65"><path d="M545 205h140M545 235h140M545 265h140M785 195h140M785 230h140M785 265h140M785 300h140"/></g>
    </g>
    <!-- exhaust stacks with realistic banding -->
    <g>
      <path d="M475 330 L492 75 L548 75 L566 330Z" fill="url(#metalDark)" stroke="#273f49" stroke-width="4"/>
      <path d="M1010 330 L1030 55 L1092 55 L1112 330Z" fill="url(#metalDark)" stroke="#273f49" stroke-width="4"/>
      <g stroke="#d7e3e5" stroke-width="8" opacity=".65"><path d="M487 130h66M484 185h69M481 240h73M1024 112h75M1021 170h79M1018 228h82"/></g>
      <ellipse cx="520" cy="73" rx="29" ry="9" fill="#d5e1e4" opacity=".8"/><ellipse cx="1061" cy="53" rx="32" ry="10" fill="#d5e1e4" opacity=".8"/>
    </g>
    <!-- gas turbine exhaust / piping -->
    <g fill="none" stroke="#718c95" stroke-width="18" stroke-linecap="round">
      <path d="M710 185 V135 H870 V170"/><path d="M610 185 V120 H470 V75"/><path d="M950 170 V105 H1030 V55"/>
    </g>
    <g fill="none" stroke="#c5d6da" stroke-width="6"><path d="M710 185 V135 H870 V170"/><path d="M610 185 V120 H470 V75"/><path d="M950 170 V105 H1030 V55"/></g>
    <!-- pipe racks -->
    <g fill="none" stroke="#2f4e59" stroke-width="10">
      <path d="M40 455 H390 V390 H1220 V340 H1540"/><path d="M70 485 H350 V425 H1190 V375 H1560"/><path d="M1060 485 V250 H1370"/>
    </g>
    <g stroke="#385865" stroke-width="7"><path d="M100 455v-85M180 455v-85M260 455v-85M340 455v-85M430 390v-90M510 390v-90M590 390v-90M670 390v-90M750 390v-90M830 390v-90M910 390v-90M990 390v-90M1060 485v-235M1160 455v-95M1260 455v-95M1360 455v-95M1460 455v-95"/></g>
    <!-- gas storage tanks -->
    <g stroke="#415e68" stroke-width="4">
      <ellipse cx="1250" cy="430" rx="90" ry="28" fill="#a6b8bd"/><rect x="1160" y="320" width="180" height="110" fill="url(#metalLight)"/><ellipse cx="1250" cy="320" rx="90" ry="28" fill="#d8e2e4"/><path d="M1178 350h144M1178 385h144" stroke="#d4e0e3" stroke-width="6" opacity=".65"/>
      <ellipse cx="1450" cy="435" rx="65" ry="22" fill="#a6b8bd"/><rect x="1385" y="350" width="130" height="85" fill="url(#metalLight)"/><ellipse cx="1450" cy="350" rx="65" ry="22" fill="#d8e2e4"/>
    </g>
    <!-- flare stack -->
    <g>
      <path d="M1515 465 V185" stroke="#405d67" stroke-width="14"/><path d="M1490 185H1540" stroke="#405d67" stroke-width="14" stroke-linecap="round"/>
      <path d="M1515 177 C1484 146 1502 115 1518 90 C1538 120 1562 140 1535 177 C1528 188 1520 190 1515 177Z" fill="url(#fire)"/>
      <ellipse cx="1518" cy="95" rx="70" ry="42" fill="#ffae24" opacity=".16" filter="url(#softShadow)"/>
    </g>
    <!-- power transmission -->

<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<script>
const DATA_GITHUB_OWNER="quocdaicm";
const DATA_GITHUB_REPO="tra-cuu-kien-hang";
const DATA_GITHUB_BRANCH="main";
const DATA_GITHUB_FOLDER="du-lieu";

let dailyFiles=[];
let dailyData=[];
let data=[];
let moveHistory=[];

function norm(v){return String(v??"").trim();}

function formatDate(v){
  if(v instanceof Date && !isNaN(v))
    return String(v.getDate()).padStart(2,"0")+"/"+String(v.getMonth()+1).padStart(2,"0")+"/"+v.getFullYear();
  if(typeof v==="number"){
    const d=XLSX.SSF.parse_date_code(v);
    if(d)return String(d.d).padStart(2,"0")+"/"+String(d.m).padStart(2,"0")+"/"+d.y;
  }
  return norm(v);
}

function escapeHtml(s){
  return String(s).replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]));
}

function fileUrl(name){
  return "https://raw.githubusercontent.com/"+DATA_GITHUB_OWNER+"/"+DATA_GITHUB_REPO+"/"+DATA_GITHUB_BRANCH+"/"+DATA_GITHUB_FOLDER+"/"+encodeURIComponent(name);
}

async function listDailyExcelFiles(){
  const url=`https://api.github.com/repos/${DATA_GITHUB_OWNER}/${DATA_GITHUB_REPO}/contents/${DATA_GITHUB_FOLDER}?ref=${DATA_GITHUB_BRANCH}`;
  const r=await fetch(url,{cache:"no-store"});
  if(!r.ok)throw new Error("Không đọc được thư mục /du-lieu trên GitHub ("+r.status+").");
  const items=await r.json();
  return items
    .filter(x=>x.type==="file" && /\.(xlsx|xls)$/i.test(x.name))
    .sort((a,b)=>a.name.localeCompare(b.name,"en",{numeric:true}));
}

async function readExcelFile(item){
  const r=await fetch(fileUrl(item.name),{cache:"no-store"});
  if(!r.ok)throw new Error("Không tải được "+item.name);
  const buf=await r.arrayBuffer();
  const wb=XLSX.read(buf,{type:"array",cellDates:true});
  const ws=wb.Sheets[wb.SheetNames[0]];
  const rows=XLSX.utils.sheet_to_json(ws,{defval:""});
  const required=["Ngày","Mã kiện","Nhóm","Danh mục","Vị trí"];
  if(rows.length){
    const keys=Object.keys(rows[0]);
    const missing=required.filter(x=>!keys.includes(x));
    if(missing.length)throw new Error(item.name+" thiếu cột: "+missing.join(", "));
  }
  return rows.map(row=>({
    date:formatDate(row["Ngày"]),
    code:norm(row["Mã kiện"]),
    group:norm(row["Nhóm"]),
    category:norm(row["Danh mục"]),
    loc:norm(row["Vị trí"]),
    sourceFile:item.name
  })).filter(x=>x.code);
}

async function loadAllDailyExcel(){
  const status=document.getElementById("ghStatus");
  status.textContent="⏳ Đang đọc dữ liệu trong /du-lieu...";

  dailyFiles=await listDailyExcelFiles();
  if(!dailyFiles.length){
    dailyData=[];data=[];moveHistory=[];render();
    status.textContent="⚠️ Chưa có file Excel trong /du-lieu.";
    return;
  }

  const results=await Promise.all(dailyFiles.map(readExcelFile));
  dailyData=results.flat();

  // Sắp xếp theo ngày; nếu cùng ngày thì theo tên file.
  dailyData.sort((a,b)=>{
    const da=parseDate(a.date), db=parseDate(b.date);
    return (da-db) || a.sourceFile.localeCompare(b.sourceFile,"en",{numeric:true});
  });

  // Mỗi mã kiện lấy lần xuất hiện cuối cùng làm vị trí hiện tại.
  const map=new Map();
  const history=[];

  for(const item of dailyData){
    const old=map.get(item.code);
    if(old && norm(old.loc)!==norm(item.loc)){
      history.push({
        code:item.code,
        oldLoc:old.loc,
        newLoc:item.loc,
        time:item.date||item.sourceFile
      });
    }
    map.set(item.code,item);
  }

  data=[...map.values()].map(x=>({
    date:x.date,code:x.code,group:x.group,category:x.category,loc:x.loc
  }));

  moveHistory=history;
  render();

  status.textContent=`✅ Đã đọc ${dailyFiles.length} file Excel — ${dailyData.length} dòng — ${data.length} kiện hiện tại.`;
}

function parseDate(s){
  const m=String(s).match(/^(\d{1,2})[\/-](\d{1,2})[\/-](\d{4})$/);
  if(!m)return 0;
  return new Date(+m[3],+m[2]-1,+m[1]).getTime();
}

function unique(key){
  return [...new Set(data.map(x=>norm(x[key])).filter(Boolean))]
    .sort((a,b)=>a.localeCompare(b,"vi"));
}

function filterLabel(id){
  return ({
    date:"Ngày nhận",
    group:"Loại hàng",
    category:"P/L No.",
    loc:"Vị trí"
  })[id] || "Chọn";
}

function fillFilter(id,values){
  const el=document.getElementById(id);
  const old=el.value;
  el.innerHTML=`<option value="">${filterLabel(id)}</option>`+
    values.map(v=>`<option value="${escapeHtml(v)}">${escapeHtml(v)}</option>`).join("");
  if(values.includes(old))el.value=old;
}

function refreshFilters(){
  fillFilter("date",unique("date"));
  fillFilter("group",unique("group"));
  fillFilter("category",unique("category"));
  fillFilter("loc",unique("loc"));
}

function historyHtml(code){
  const h=moveHistory.filter(x=>x.code===code);
  if(!h.length)return "";
  return `<div class="history"><div class="history-title"><span class="history-icon">◷</span> Lịch sử di chuyển</div>`+
    h.map(x=>`<div class="history-item">${escapeHtml(x.time)}: <b>${escapeHtml(x.oldLoc||"Chưa có")}</b> → <b>${escapeHtml(x.newLoc||"")}</b></div>`).join("")+
    `</div>`;
}


let currentFiltered=[];
let currentPage=1;
const pageSize=5;

function render(){
  refreshFilters();
  const q=norm(document.getElementById("q").value).toLowerCase();
  const date=document.getElementById("date").value;
  const group=document.getElementById("group").value;
  const category=document.getElementById("category").value;
  const loc=document.getElementById("loc").value;

  const filtered=data.filter(x=>{
    const hay=[x.date,x.code,x.group,x.category,x.loc].join(" ").toLowerCase();
    return (!q||hay.includes(q)) && (!date||x.date===date) && (!group||x.group===group) && (!category||x.category===category) && (!loc||x.loc===loc);
  });

  currentFiltered=filtered;
  const totalPages=Math.max(1,Math.ceil(filtered.length/pageSize));
  if(currentPage>totalPages) currentPage=totalPages;
  const start=(currentPage-1)*pageSize;
  const pageItems=filtered.slice(start,start+pageSize);

  document.getElementById("total").textContent=data.length.toLocaleString("vi-VN");
  document.getElementById("shown").textContent=filtered.length.toLocaleString("vi-VN");
  document.getElementById("groups").textContent=unique("group").length;
  document.getElementById("cats").textContent=unique("category").length;
  document.getElementById("locs").textContent=unique("loc").length;

  document.getElementById("list").innerHTML=pageItems.length
    ? pageItems.map((x,i)=>`
      <div class="card">
        <div class="card-main">
          <div class="package-icon"><span>📦</span></div>
          <div>
            <div class="code">${start+i+1}. ${escapeHtml(x.code)}</div>
            <button class="copy" onclick="copyCode('${escapeHtml(x.code)}')"><span>📋</span> Copy mã</button>
          </div>
          <div class="field"><span class="field-label"><span class="mini-icon">🏷️</span> Loại hàng</span><span class="field-value">${escapeHtml(x.group||"—")}</span></div>
          <div class="field"><span class="field-label"><span class="mini-icon">📄</span> P/L No.</span><span class="field-value">${escapeHtml(x.category||"—")}</span></div>
          <div class="field"><span class="field-label"><span class="mini-icon">📍</span> Vị trí</span><span class="field-value">${escapeHtml(x.loc||"Chưa có")}</span></div>
          <div class="field"><span class="field-label"><span class="mini-icon">📅</span> Ngày nhận</span><span class="field-value">📅 &nbsp;${escapeHtml(x.date||"—")}</span></div>
          <div class="share-wrap"><button class="share" onclick="shareItem(${start+i})"><span>🔗</span> Chia sẻ</button></div>
        </div>
        ${historyHtml(x.code)}
      </div>`).join("")
    : '<div class="empty">Không tìm thấy kiện hàng.</div>';

  const p=document.getElementById("pagination");
  p.innerHTML=totalPages>1 ? `<button onclick="goPage(${currentPage-1})" ${currentPage===1?'disabled':''}>‹</button>`+Array.from({length:Math.min(totalPages,5)},(_,i)=>{let n=i+1;return `<button class="${n===currentPage?'active':''}" onclick="goPage(${n})">${n}</button>`}).join("")+`<button onclick="goPage(${currentPage+1})" ${currentPage===totalPages?'disabled':''}>›</button>` : '';
}
function goPage(n){currentPage=Math.max(1,Math.min(n,Math.ceil(currentFiltered.length/pageSize)||1));render();window.scrollTo({top:document.getElementById("list").offsetTop-10,behavior:"smooth"});}

function shareItem(index){
  const x=currentFiltered[index];
  if(!x)return;

  const title=`📦 Kiện hàng ${x.code}`;
  const details=[
    `Mã kiện: ${x.code||"—"}`,
    `Loại hàng: ${x.group||"—"}`,
    `P/L No.: ${x.category||"—"}`,
    `Vị trí: ${x.loc||"Chưa có vị trí"}`,
    `Ngày nhận: ${x.date||"—"}`
  ].join("\n");
  const shareText=`${title}\n${details}`;

  if(navigator.share){
    navigator.share({
      title:title,
      text:shareText,
      url:location.href
    }).catch(()=>{});
  }else{
    navigator.clipboard?.writeText(shareText).then(()=>{
      showShareNotice("✅ Đã sao chép kết quả để bạn gửi/chia sẻ.");
    }).catch(()=>{
      showShareNotice(shareText);
    });
  }
}

function showShareNotice(message){
  const old=document.querySelector(".share-result");
  if(old)old.remove();
  const el=document.createElement("div");
  el.className="share-result";
  el.textContent=message;
  document.body.appendChild(el);
  setTimeout(()=>el.remove(),2600);
}

function copyCode(code){
  navigator.clipboard?.writeText(code);
}

function reloadGitHubData(){
  loadAllDailyExcel().catch(err=>{
    console.error(err);
    document.getElementById("ghStatus").textContent="❌ "+err.message;
  });
}

function showDailyFiles(){
  if(!dailyFiles.length){
    alert("Chưa có file Excel trong /du-lieu.");
    return;
  }
  alert("Các file Excel đang có:\n\n"+dailyFiles.map(x=>"• "+x.name).join("\n"));
}

window.addEventListener("load",()=>loadAllDailyExcel().catch(err=>{
  document.getElementById("ghStatus").textContent="❌ "+err.message;
}));
</script>
